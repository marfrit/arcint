# Build the arcint image (the engine with its llama.cpp pin and patches, on
# Fedora with Intel's compute runtime) and publish it to GHCR under whichever
# namespace runs the workflow.
#
# Images produced (OWNER is the lowercase repo owner, so this works from a
# fork without edits):
#   ghcr.io/<OWNER>/arcint:<immutable ts>
#   ghcr.io/<OWNER>/arcint:<channel>          moving, default edge
#
# The Dockerfile gates its llama.cpp build args against the deb recipe, so an
# image and the recipe cannot disagree about the pin. GHCR packages are
# private on first push -- set the package visibility to public afterwards to
# let others pull.
#
# Until 0.7.12 a second job built a patched-OpenVINO base (arcint-ov); that
# engine was retired in 0.8.0 and the published arcint-ov images stay as they
# are. Design, tagging and the CPU-baseline caveats: docs/docker.md.

name: Build arcint image

"on":
  workflow_dispatch:
    inputs:
      channel:
        description: 'Moving channel tag for the image'
        required: false
        default: edge

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Resolve the lowercase namespace and the build timestamp once, in shell,
      # where the evaluation is visible in the log.
      - id: ns
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "build_ts=$(date +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: |
          docker build \
            --build-arg ARCINT_GIT_SHA=${GITHUB_SHA::12} \
            -t ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/arcint:build-${{ steps.ns.outputs.build_ts }} \
            -f docker/Dockerfile.arcint .

      # Re-run the device-free smoke test against the FINAL image before the
      # channel tag is published. It must run INSIDE the container: the stub
      # binds 127.0.0.1 in the container's network namespace, so a host-side
      # curl has nothing to connect to.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/arcint:build-${{ steps.ns.outputs.build_ts }} \
            -c '/usr/bin/arcint --stub --port 8090 & S=$!; sleep 2; curl -fsS http://127.0.0.1:8090/props > /dev/null; R=$?; kill $S 2>/dev/null; wait $S 2>/dev/null; exit $R'

      - name: Push immutable + channel tags
        run: |
          IMG=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/arcint
          docker tag "$IMG:build-${{ steps.ns.outputs.build_ts }}" "$IMG:${{ steps.ns.outputs.build_ts }}"
          docker push "$IMG:${{ steps.ns.outputs.build_ts }}"
          docker tag "$IMG:build-${{ steps.ns.outputs.build_ts }}" "$IMG:${{ github.event.inputs.channel }}"
          docker push "$IMG:${{ github.event.inputs.channel }}"
