# Run recipe for the arcint toolbox, in compose form.
#
# Mirrors kyuz0's device recipe: /dev/dri passthrough + video/render groups
# + seccomp unconfined. Models are mounted read-only, never baked in.
#
# Three services, one compose profile each -- the command lines the project's
# own services run (0.7.8; docs/docker.md, "The three services"):
#   docker compose --profile coder up        # the coder, a 16 GB card
#   docker compose --profile agent up        # the dense 27B agent, a 24 GB card
#   docker compose --profile flashnext up    # Qwen3.8-Flash-Next, a 24 GB card + ~23 GB pinned host memory
# Run one service per card. For an OpenVINO IR instead, replace a command with
# --model <ir-dir> --model-id <id> (docs/docker.md, Running).

x-arcint: &arcint
  image: ghcr.io/<OWNER>/arcint:edge          # your registry + namespace
  restart: unless-stopped
  devices:
    - /dev/dri:/dev/dri
  group_add:
    - video
    - render
  security_opt:
    - seccomp=unconfined
  volumes:
    # GGUF files (and OpenVINO IR directories), read-only.
    - ${MODELS_ROOT:-/models}:/models:ro
    # The kernel caches (ggml-opencl's programs; the OpenVINO engine's blob
    # cache with --cache-dir). Writable, persistent: a cold cache turns every
    # start into a recompile.
    - arcint-cache:/var/cache/arcint

services:
  coder:
    <<: *arcint
    profiles: ["coder"]
    ports:
      - "8080:8080"          # LAN only -- no auth, no TLS (DEVELOPMENT.md)
    environment:
      ARCINT_HEALTH_URL: http://127.0.0.1:8080/props
      # ggml-opencl's compiled-program cache; its default is under $HOME,
      # which does not survive the container.
      GGML_OPENCL_KERNEL_CACHE_DIR: /var/cache/arcint/opencl
    command: [--engine, llama, --gguf, /models/gguf/<coder>.gguf,
              --served-model-name, qwen3.6-coder, --device, GPU.0,
              --host, 0.0.0.0, --port, "8080",
              --n-ctx, "98304", --llama-mtp, "4", --llama-kv, "q8_0:q4_0",
              --queue-timeout, "30"]

  agent:
    <<: *arcint
    profiles: ["agent"]
    ports:
      - "8087:8087"
    environment:
      ARCINT_HEALTH_URL: http://127.0.0.1:8087/props
      GGML_OPENCL_KERNEL_CACHE_DIR: /var/cache/arcint/opencl
    command: [--engine, llama, --gguf, /models/gguf/<qwen3.8-27b-q4_k_m>.gguf,
              --served-model-name, qwen3.8-agent, --device, GPU.0,
              --host, 0.0.0.0, --port, "8087",
              --n-ctx, "245760", --llama-kv, "q8_0:q4_0", --llama-mtp, "5",
              --llama-mtp-vocab, /models/<draft-vocab>.json,
              --queue-timeout, "30", --repetition-penalty, "1.0"]

  flashnext:
    <<: *arcint
    profiles: ["flashnext"]
    ports:
      - "8089:8089"
    environment:
      ARCINT_HEALTH_URL: http://127.0.0.1:8089/props
      GGML_OPENCL_KERNEL_CACHE_DIR: /var/cache/arcint/opencl
      # the expert bank streamed for prompts of 256 tokens and more (patches 0032, 0044)
      GGML_OPENCL_BANK_STREAM: "1"
      # Infernix's LFRU expert-cache policy instead of Strata's adapt (patch 0055)
      LLAMA_EXPERT_CACHE_POLICY: lfru
    command: [--engine, llama, --gguf, /models/gguf/<flash-next-iq2_xs-00001-of-00002>.gguf,
              --served-model-name, qwen3.8-flash-next, --device, GPU.0,
              --host, 0.0.0.0, --port, "8089",
              --n-ctx, "131072", --llama-cpu-moe, "48", --llama-threads, "8",
              --llama-expert-cache, "13400", --llama-reserve-cells, "20480",
              --llama-expert-profile, /models/<expert-profile>.bin,
              --llama-mtp, "3", --llama-mtp-min-p, "0.5", --llama-mtp-gguf, /models/<flash-next-mtp-head>.gguf,
              --llama-kv, q8_0, --queue-timeout, "30"]

volumes:
  arcint-cache:
